/* Layout: one phone-width column, hero balance card on top, floating + in the tab bar */
:root{
  --bg:#3A86D6; --surface:rgba(255,255,255,.80); --surface-2:rgba(226,238,252,.85); --ink:#13243A; --muted:#5A6E88; --line:rgba(40,80,140,.14);
  --brand:#2A5C9C; --hero:rgba(20,58,116,.58); --brand-ink:#FFFFFF; --brand-soft:#DCEAFB; --accent:#8CC8FF; --accent-2:#C9A6F5;
  --good:#3E9A6E; --good-soft:#DDF1E6; --warn:#D08A2E; --warn-soft:#FBEBD2; --bad:#D04B5E; --bad-soft:#FADDE2;
  --veil:rgba(255,255,255,.06); --shadow:0 8px 28px rgba(10,40,90,.18);
  --font:"Itim", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:20px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1A2E; --surface:rgba(14,28,50,.80); --surface-2:rgba(30,50,82,.82); --ink:#EAF2FF; --muted:#9DB1CC; --line:rgba(200,225,255,.10);
    --brand:#8CC8FF; --hero:rgba(8,22,46,.70); --brand-ink:#FFFFFF; --brand-soft:#1E3456; --accent:#8CC8FF; --accent-2:#C9A6F5;
    --good:#7FD3A6; --good-soft:#173527; --warn:#F0B565; --warn-soft:#3A2C17; --bad:#F2899A; --bad-soft:#3D1D25;
    --veil:rgba(4,12,26,.55); --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0B1A2E; --surface:rgba(14,28,50,.80); --surface-2:rgba(30,50,82,.82); --ink:#EAF2FF; --muted:#9DB1CC; --line:rgba(200,225,255,.10);
    --brand:#8CC8FF; --hero:rgba(8,22,46,.70); --brand-ink:#FFFFFF; --brand-soft:#1E3456; --accent:#8CC8FF; --accent-2:#C9A6F5;
    --good:#7FD3A6; --good-soft:#173527; --warn:#F0B565; --warn-soft:#3A2C17; --bad:#F2899A; --bad-soft:#3D1D25;
    --veil:rgba(4,12,26,.55); --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-weight:400}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--bgimg) center top/cover no-repeat}
body > .shade{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bg);opacity:max(0,calc((var(--veil-o,1) - 1) / 2.6))}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--veil);opacity:min(1,var(--veil-o,1));pointer-events:none}
.glass{-webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:440px;margin:0 auto;min-height:100%;position:relative;
  padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.hello{font-size:13px;color:#fff;opacity:.95;white-space:nowrap;text-shadow:0 1px 6px rgba(0,30,80,.55)}
.title{color:#fff;text-shadow:0 2px 10px rgba(0,30,80,.55);white-space:nowrap;font-size:23px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.month b{font-weight:700;font-size:13px;padding:0 2px;white-space:nowrap}
.icon-btn{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2)}
.stack{display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.35);-webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.card h3 a,.link{font-size:13px;letter-spacing:0;text-transform:none;color:var(--brand);font-weight:600;cursor:pointer}
:root[data-theme="dark"] .card h3 a,:root[data-theme="dark"] .link{color:var(--good)}

/* ---------- helpers ---------- */
const fmt = n => Math.round(n).toLocaleString("vi-VN") + "đ";
const short = n => n>=1e6 ? (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"").replace(".",",")+"tr" : n>=1000 ? Math.round(n/1000)+"k" : String(n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d");
function guessCat(note, type){
  const t = " " + norm(note).replace(/[^a-z0-9-]+/g," ") + " ";
  const pool = type==="in" ? IN : OUT;
  for(const c of pool){ for(const w of (KW[c]||[])){ if(t.includes(" "+w+" ")) return c; } }
  return null;

const ic = c => `<span class="ic" style="background:${CATS[c].c}22">${CATS[c].e}</span>`;
const monthName = (y,m) => `Th${m+1}/${y}`;

function grouped(list){

const mdiff = (a,b) => { const [y1,m1,d1]=a.split("-").map(Number), [y2,m2,d2]=b.split("-").map(Number); return (y2-y1)*12 + (m2-m1) - (d2<d1?1:0); };
function goalInfo(g){
  const saved = g.dep.reduce((s,x)=>s+x.a,0), total = Math.max(1, mdiff(g.s,g.end));
  const per = g.a/total, gone = TODAY<g.s ? 0 : Math.min(total, mdiff(g.s,TODAY)+1);
  const left = Math.max(0, total - Math.max(0, mdiff(g.s,TODAY)));
  return {saved, total, per, needNow: Math.min(g.a, per*gone), remain: Math.max(0,g.a-saved), left, pct: Math.min(100, saved/g.a*100)};
}
const vdate = k => { const [y,m,d]=k.split("-"); return `${+d} thg ${+m}, ${y}`; };

}

  F = tx ? {...tx, edit:true, manual:true} : {id:uid(), t:"out", a:0, c:"an", n:"", d: isCur()||view.tab!=="cal" ? (view.tab==="cal"?view.sel:TODAY) : view.sel, manual:false};
  if(view.tab==="cal" && !tx) F.d = view.sel;
  drawSheet(); sheet.classList.add("on"); scrim.classList.add("on");
  setTimeout(()=>{ const a = document.getElementById("fa"); if(a && !tx) a.focus(); }, 260);
}
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); }
function drawSheet(){
  const pool = F.t==="in" ? IN : OUT;
  if(!pool.includes(F.c)) F.c = pool[0];
  sheet.innerHTML = `<button class="sx" data-act="close" aria-label="Đóng">✕</button><div class="grab"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h2>${F.edit?"Sửa giao dịch":"Thêm giao dịch"}</h2>
    <div class="seg"><button class="${F.t==="out"?"on":""}" data-ft="out">Chi</button><button class="${F.t==="in"?"on":""}" data-ft="in">Thu</button></div></div>
    <div class="amt ${F.t}"><input id="fa" class="num" inputmode="numeric" placeholder="0đ" value="${F.a?F.a.toLocaleString("vi-VN")+"đ":""}" aria-label="Số tiền"></div>
    <div class="quick">${[10000,20000,50000,100000,500000].map(v=>`<button data-q="${v}">+${short(v)}</button>`).join("")}<button data-q="0">Xoá</button></div>
    <div class="lbl"><label for="fn">Ghi chú</label><span class="auto" id="autoTag"></span></div>
    <input class="field" id="fn" placeholder="vd: Highlands, Grab, Shopee…" value="${esc(F.n)}">
    <div class="cats" id="fcats">${pool.map(c=>`<button class="cat ${F.c===c?"on":""}" data-fc="${c}">${ic(c)}${CATS[c].n}</button>`).join("")}</div>
    <div class="lbl"><label for="fd">Ngày</label></div>
    <input class="field" type="date" id="fd" value="${F.d}" style="margin-bottom:14px">
    <button class="btn" style="width:100%" data-act="saveTx">${F.edit?"Lưu thay đổi":"Lưu"}</button>
    ${F.edit?`<button class="btn danger" style="width:100%;margin-top:8px" data-act="delTx">Xoá giao dịch</button>`:""}`;
  const fa = document.getElementById("fa"), fn = document.getElementById("fn"), fd = document.getElementById("fd");
  fa.addEventListener("input", () => { F.a = +fa.value.replace(/\D/g,""); fa.value = F.a ? F.a.toLocaleString("vi-VN") : ""; });
  fa.addEventListener("blur", () => { if(F.a) fa.value = F.a.toLocaleString("vi-VN")+"đ"; });
  fa.addEventListener("focus", () => { fa.value = F.a ? F.a.toLocaleString("vi-VN") : ""; });
  fn.addEventListener("input", () => { F.n = fn.value; if(!F.manual){ const g = guessCat(F.n, F.t); if(g && g!==F.c){ F.c = g; document.querySelectorAll("[data-fc]").forEach(b=>b.classList.toggle("on", b.dataset.fc===g)); document.getElementById("autoTag").textContent = "✓ Tự xếp vào " + CATS[g].n; } } });
  fd.addEventListener("change", () => { F.d = fd.value || TODAY; });
}

/* ---------- goal sheets ---------- */
let G;
function sheetOpen(html){ sheet.innerHTML = `<button class="sx" data-act="close" aria-label="Đóng">✕</button><div class="grab"></div>` + html; sheet.classList.add("on"); scrim.classList.add("on"); }
function goalDetail(id){
  const g = S.goals.find(x=>x.id===id); if(!g) return; G = {id, add:0}; const I = goalInfo(g);
  sheetOpen(`<div style="display:flex;justify-content:space-between;align-items:center"><h2>${esc(g.n)}</h2><button class="mini" data-act="editGoal">Sửa</button></div>
  <div class="gd"><div class="gem">${g.e}</div><div class="bigv num">${fmt(g.a)}</div>
    <div class="sub2 num">${fmt(I.per)} mỗi tháng · Còn ${I.left} tháng</div>
    <div class="track" style="margin:14px 0 6px"><i style="width:${Math.max(I.pct,1.5)}%"></i></div><div class="sub2">${Math.round(I.pct)}% · đã góp ${fmt(I.saved)}</div></div>
  <div class="card" style="margin:14px 0;padding:4px 14px;box-shadow:none;background:var(--surface-2)">
    <div class="kv"><span>Cần đến nay</span><span class="num">${fmt(I.needNow)}</span></div>
    <div class="kv"><span>Còn lại</span><span class="num">${fmt(I.remain)}</span></div>
    <div class="kv"><span>Ngày bắt đầu</span><span>${vdate(g.s)}</span></div>
    <div class="kv"><span>Ngày mục tiêu</span><span>${vdate(g.end)}</span></div></div>
  <div class="lbl">Góp thêm</div>
  <div class="amt"><input id="ga" class="num" inputmode="numeric" placeholder="0đ" aria-label="Số tiền góp" style="font-size:30px"></div>
  <div class="quick">${[50000,100000,200000,500000].map(v=>`<button data-gq="${v}">+${short(v)}</button>`).join("")}</div>
  <div class="lbl"><label for="gdd">Ngày góp</label></div>
  <input class="field" type="date" id="gdd" value="${TODAY}" style="margin-bottom:12px">
  <button class="btn" style="width:100%" data-act="depGoal">Góp vào mục tiêu</button>
  <div class="lbl" style="margin-top:18px"><span>Lịch sử góp</span><span>${g.dep.length} lần</span></div>
  <div class="card" style="padding:2px 14px;box-shadow:none;background:var(--surface-2);margin-bottom:12px">
    ${g.dep.length ? g.dep.map((x,i)=>({...x,i})).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.i-a.i).map(x=>{ const [y,m,dd]=x.d.split("-");
      return `<div class="dep"><span class="dt">Ngày ${dd}/${m}/${y}</span><span class="da num">+${fmt(x.a)}</span><button class="dx" data-deldep="${x.i}" aria-label="Xoá lần góp">✕</button></div>`; }).join("")
      : `<div class="empty" style="padding:12px 0">Chưa góp lần nào ( ˘ω˘ )</div>`}
  </div>
  <button class="btn danger" style="width:100%;margin-top:8px" data-act="delGoal">Xoá mục tiêu</button>`);
  const ga = document.getElementById("ga");
  ga.addEventListener("input", () => { G.add = +ga.value.replace(/\D/g,""); ga.value = G.add ? G.add.toLocaleString("vi-VN") : ""; });
}
function goalForm(id){
  const g = id ? {...S.goals.find(x=>x.id===id)} : {id:uid(),n:"",e:"✨",a:0,s:TODAY,end:dkey(now.getFullYear()+1,now.getMonth(),now.getDate()),dep:[]};
  G = {form:g, edit:!!id};
  sheetOpen(`<h2>${id?"Sửa mục tiêu":"Mục tiêu mới"}</h2>
  <div class="lbl">Biểu tượng</div><div class="emo">${EMO.map(e=>`<button class="${g.e===e?"on":""}" data-emo="${e}">${e}</button>`).join("")}</div>
  <div class="lbl"><label for="gn">Tên mục tiêu</label></div><input class="field" id="gn" placeholder="vd: Bảng vẽ, Đi Đà Lạt…" value="${esc(g.n)}" style="margin-bottom:12px">
  <div class="lbl"><label for="gt">Số tiền cần</label></div><input class="field num" id="gt" inputmode="numeric" placeholder="vd: 4.000.000" value="${g.a?g.a.toLocaleString("vi-VN"):""}" style="margin-bottom:12px">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
    <div><div class="lbl"><label for="gs">Bắt đầu</label></div><input class="field" type="date" id="gs" value="${g.s}"></div>
    <div><div class="lbl"><label for="ge">Ngày mục tiêu</label></div><input class="field" type="date" id="ge" value="${g.end}"></div></div>
  <button class="btn" style="width:100%" data-act="saveGoal">${id?"Lưu thay đổi":"Tạo mục tiêu"}</button>`);
  const gt = document.getElementById("gt");
  gt.addEventListener("input", () => { const v = +gt.value.replace(/\D/g,""); gt.value = v ? v.toLocaleString("vi-VN") : ""; });
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button,[data-go],[data-act]"); if(!b) return;
  const d = b.dataset;
  if(d.tab){ view.tab = d.tab; render(); window.scrollTo(0,0); return; }
  if(d.go){ view.tab = d.go; render(); window.scrollTo(0,0); return; }
  if(d.mon){ const n = new Date(view.y, view.m + +d.mon, 1); view.y=n.getFullYear(); view.m=n.getMonth();
    view.sel = (view.y===now.getFullYear()&&view.m===now.getMonth()) ? TODAY : dkey(view.y,view.m,1); render(); return; }
  if(d.day){ view.sel = d.day; render(); return; }
  if(d.goal){ goalDetail(d.goal); return; }
  if(d.deldep!==undefined){ if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="?"; b.style.background="var(--bad-soft)"; b.style.color="var(--bad)"; toast("Bấm lần nữa để xoá lần góp này"); return; }
    const g = S.goals.find(x=>x.id===G.id); g.dep.splice(+d.deldep,1); save(); render(); goalDetail(g.id); toast("Đã xoá lần góp"); return; }
  if(d.emo){ G.form.e = d.emo; document.querySelectorAll("[data-emo]").forEach(x=>x.classList.toggle("on", x.dataset.emo===d.emo)); return; }
  if(d.gq){ G.add += +d.gq; document.getElementById("ga").value = G.add.toLocaleString("vi-VN"); return; }
  if(d.edit){ const t = S.tx.find(x=>x.id===d.edit); t && openSheet(t); return; }
  if(d.theme){ S.theme = d.theme; save(); render(); return; }
  if(d.pay){ const bill = S.bills.find(x=>x.id===d.pay), k = ym(view.y,view.m);
    (S.paid[k] ||= []).push(bill.id); S.tx.push({id:uid(),t:"out",a:bill.a,c:bill.c,n:bill.n,d:TODAY}); save(); render(); toast("Đã ghi " + bill.n); return; }
  if(d.delbill){ S.bills = S.bills.filter(x=>x.id!==d.delbill); save(); render(); return; }
  if(d.ft){ F.t = d.ft; F.manual = false; drawSheet(); return; }
  if(d.fc){ F.c = d.fc; F.manual = true; document.querySelectorAll("[data-fc]").forEach(x=>x.classList.toggle("on", x.dataset.fc===F.c)); document.getElementById("autoTag").textContent=""; return; }
  if(d.q!==undefined){ F.a = +d.q ? F.a + +d.q : 0; document.getElementById("fa").value = F.a ? F.a.toLocaleString("vi-VN")+"đ" : ""; return; }
  switch(d.act){
    case "saveTx": {
      if(!F.a){ toast("Nhập số tiền trước nha"); return; }
      const t = {id:F.id,t:F.t,a:F.a,c:F.c,n:F.n.trim(),d:F.d||TODAY};
      const i = S.tx.findIndex(x=>x.id===t.id); i>=0 ? S.tx[i]=t : S.tx.push(t);
      save(); closeSheet(); render(); toast(F.edit?"Đã lưu thay đổi":"Đã thêm " + fmt(t.a) + " ✧"); break; }
    case "delTx": S.tx = S.tx.filter(x=>x.id!==F.id); save(); closeSheet(); render(); toast("Đã xoá"); break;
    case "clearSample": S.tx = []; S.bills = []; S.paid = {}; S.goals = []; S.sample = false; save(); render(); toast("Sạch sẽ rồi, bắt đầu ghi thôi!"); break;
    case "reset": if(b.dataset.armed){ localStorage.removeItem(KEY); S = {v:1,budget:5000000,theme:S.theme,sample:false,tx:[],bills:[],paid:{},goals:[],veil:S.veil}; save(); render(); toast("Đã xoá toàn bộ"); }
      else { b.dataset.armed = "1"; b.textContent = "Bấm lần nữa để xoá thật"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent = "Xoá toàn bộ dữ liệu"; } }, 3000); } break;
    case "addBill": {
      const n = document.getElementById("bn").value.trim(), a = +document.getElementById("ba").value.replace(/\D/g,""), day = Math.min(31, Math.max(1, +document.getElementById("bd").value||1));
      if(!n || !a){ toast("Điền tên và số tiền nha"); return; }
      S.bills.push({id:uid(),n,a,day,c:guessCat(n,"out")||"hoadon"}); save(); render(); toast("Đã thêm hoá đơn"); break; }
    case "export": {
      const blob = new Blob([JSON.stringify(S,null,1)],{type:"application/json"}), a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `so-matcha-${TODAY}.json`; document.body.appendChild(a); a.click(); a.remove();
      toast("Đã xuất file sao lưu"); break; }
    case "import": document.getElementById("importFile").click(); break;
    case "close": closeSheet(); break;
    case "newGoal": goalForm(); break;
    case "editGoal": goalForm(G.id); break;
    case "saveGoal": {
      const f = G.form; f.n = document.getElementById("gn").value.trim(); f.a = +document.getElementById("gt").value.replace(/\D/g,"");
      f.s = document.getElementById("gs").value || TODAY; f.end = document.getElementById("ge").value || f.s;
      if(!f.n || !f.a){ toast("Điền tên với số tiền nha"); return; }
      if(f.end <= f.s){ toast("Ngày mục tiêu phải sau ngày bắt đầu"); return; }
      const i = S.goals.findIndex(x=>x.id===f.id); i>=0 ? S.goals[i]=f : S.goals.push(f);
      save(); render(); goalDetail(f.id); toast(G.edit?"Đã lưu":"Tạo mục tiêu rồi ✧"); break; }
    case "depGoal": {
      if(!G.add){ toast("Nhập số tiền góp trước nha"); return; }
      const g = S.goals.find(x=>x.id===G.id); g.dep.push({a:G.add,d:document.getElementById("gdd").value||TODAY}); const amt = G.add;
      save(); render(); goalDetail(g.id); toast("Góp thêm " + fmt(amt) + " (๑•̀ㅂ•́)و✧"); break; }
    case "delGoal": if(b.dataset.armed){ S.goals = S.goals.filter(x=>x.id!==G.id); save(); closeSheet(); render(); toast("Đã xoá mục tiêu"); }
      else { b.dataset.armed = "1"; b.textContent = "Bấm lần nữa để xoá thật"; } break;
  }
});
document.getElementById("fab").addEventListener("click", () => openSheet());
scrim.addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });
document.getElementById("importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; if(!f) return;
  try{ const d = JSON.parse(await f.text()); if(!Array.isArray(d.tx)) throw 0; S = {bills:[],paid:{},theme:"auto",budget:5000000,...d}; save(); render(); toast(`Đã nhập ${S.tx.length} giao dịch`); }
  catch(_){ toast("File không đúng định dạng sao lưu"); }
  e.target.value = "";
});

load(); render();
})();
</script>
</body>
</html>
